name: Release

on:
  push:
    tags:
      # SemVer 全形态：正式 vX.Y.Z 与预发布 vX.Y.Z-*（rc/beta 等预发布通道走
      # 同一构建流程，P-20261101-2）。glob 语义按官方 filter pattern cheat sheet
      # （[0-9]=单字符区间，+=前一字符一个或多个，*=零或多字符）
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # 手动补发（P-20261103-3）：tag 事件产物损坏（gh 批量上传偶发资产 404 实锚）
  # 或 npm 部分失败时，指名 tag 幂等重跑——Release 已存在则补传资产+刷新说明，
  # npm 已发布版本自动跳过。Actions 页 Run workflow → 填 tag 名
  workflow_dispatch:
    inputs:
      ref:
        description: '要（重）发布的 tag（如 v0.0.1-beta.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    env:
      # 发布目标 tag：tag 事件=tag 名；dispatch 补发=输入值（build/建页/npm
      # 三处统一消费，替代语义分叉的 GITHUB_REF_NAME——dispatch 时后者是分支名）
      RELREF: ${{ github.event.inputs.ref || github.ref_name }}
      # ed25519 验签公钥（公开无妨——验签语义是「客户端只信自己体内公钥」，
      # 私钥在用户侧 secret CC_UPDATE_PRIVATE_KEY，见 docs/release-runbook.md §2）
      CC_UPDATE_PUBKEY: GmAp2SjsrNkCSSt3ekzZNOKuMv99V+aibhNbfd3KrNc=
      # 签名私钥（secret）：缺失时 build.sh 跳过签名——不产出每资产 .sha256/.sig
      # 伴随资产 → 客户端自更新因「无校验依据」被安全策略拒绝（曾实锚：只接了
      # 公钥忘了接私钥，secret 配了 workflow 却没读取）
      CC_UPDATE_PRIVATE_KEY: ${{ secrets.CC_UPDATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh derives the version from the nearest reachable v* tag；
          # dispatch 补发时按输入 tag 检出（主分支 HEAD 与 tag 提交可能不同）
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build all platforms
        shell: bash
        run: set -o pipefail; ./build.sh all 2>&1 | tee build-diagnostic.log

      # 失败时把构建日志推回 ci-diagnostics 分支（raw 可匿名直读）——
      # Actions log API 与 artifact 下载都要求登录，这是自服务诊断通道
      - name: Push build diagnostics
        if: failure()
        run: |
          git config user.email "noreply@github.com"
          git config user.name "release-diagnostics"
          git fetch origin ci-diagnostics 2>/dev/null || true
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null || git checkout -B ci-diagnostics
          git add build-diagnostic.log
          git commit -m "build diagnostics for ${RELREF} (${GITHUB_SHA})" || exit 0
          git push origin ci-diagnostics --force

      # npm 分发（P-20261102-2）需要裸二进制（release 资产是同名裸文件，但
      # 跨 job 传递走 artifact 最省依赖——不与 release 创建步骤耦合）
      - name: Upload raw binaries for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: npm-binaries
          path: dist/codecombo-*
          if-no-files-found: error
          retention-days: 1

      - name: Generate checksums
        run: |
          cd dist
          sha256sum codecombo-* > SHA256SUMS.txt

      # Release 页简要说明 = CHANGELOG 本版本段（Keep a Changelog 惯例——
      # 版本叙事唯一事实源在 CHANGELOG，发布页只做摘录不做第二份手写）。
      # 双语锚点化模板（P-20261112-3，循 deepseek-harness Release 页同款）：
      # 顶部一行「English | 中文」锚点链接，英/中各自成带锚小节（英文在前）——
      # 首屏默认英文（用户定向，P-20261112-4 翻转节序），「## 中文」标题退到
      # 中文节起始处（锚点目标不可删、语义仍正确：标记中文节开始）；GitHub 对
      # body 内 markdown 标题自动生成锚 id（`## 中文`→#中文、`## English`→
      # #english，同平台同机制实证），点击切换行即跳语言小节，免滚长文找语言；
      # 该 body 也是应用内更新面板渲染一行切换的载体（锚点拦截滚动与节序无关）
      - name: Extract release notes
        run: |
          VERSION="${RELREF#v}"
          extract_section() {
            awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                if (index($0, "[" v "]") > 0) { found = 1; next }
              }
              found { print }
            ' "$1"
          }
          en_notes=$(extract_section CHANGELOG.md)
          zh_notes=""
          if [ -f docs/CHANGELOG.zh-CN.md ]; then
            zh_notes=$(extract_section docs/CHANGELOG.zh-CN.md)
          fi
          # 两段提取全空（版本段不存在）→ 回落一行指引（模板装配只在有叙事时进行）
          if [ -z "$(printf '%s%s' "$zh_notes" "$en_notes" | tr -d '[:space:]')" ]; then
            echo "See [CHANGELOG.md](https://github.com/wtr20211202/codecombo/blob/main/CHANGELOG.md) for what is new." > release-notes.md
          else
            {
              echo "[English](#english) | [中文](#中文)"
              echo ""
              echo "## English"
              echo ""
              printf '%s\n' "$en_notes"
              echo ""
              echo "---"
              echo ""
              echo "## 中文"
              echo ""
              printf '%s\n' "$zh_notes"
            } > release-notes.md
            # 模板回归硬闸：切换行/两锚点小节/双语叙事在位且英文节在前——
            # 断言不过即停本步，Release 不创建（红底不发布，防模板回归静默上线）
            [ "$(sed -n '1p' release-notes.md)" = '[English](#english) | [中文](#中文)' ] \
              || { echo "FATAL: 顶部「English | 中文」切换行不在位（模板回归）" >&2; exit 1; }
            [ -n "$(printf '%s' "$zh_notes" | tr -d '[:space:]')" ] \
              || { echo "FATAL: 中文叙事段为空——docs/CHANGELOG.zh-CN.md 缺本版本段" >&2; exit 1; }
            [ -n "$(printf '%s' "$en_notes" | tr -d '[:space:]')" ] \
              || { echo "FATAL: English 叙事段为空——CHANGELOG.md 缺本版本段" >&2; exit 1; }
            zh_line=$(grep -nx '## 中文' release-notes.md | cut -d: -f1)
            en_line=$(grep -nx '## English' release-notes.md | cut -d: -f1)
            [ -n "$zh_line" ] && [ -n "$en_line" ] && [ "$en_line" -lt "$zh_line" ] \
              || { echo "FATAL: 两锚点小节（## English / ## 中文）缺失或顺序错误（英文须在前）" >&2; exit 1; }
          fi
          cat release-notes.md

      # 用 gh CLI 替代 softprops action：错误输出可 tee 进诊断分支（action 是
      # 黑盒，曾致资产上传失败无从诊断）。幂等：release 已存在（含「删 tag 把
      # 已发布 release 转成 draft」的 GitHub 行为）则补传资产并强制发布态
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 预发布判定：tag 含 '-' 即 SemVer 预发布形态——页面带 Pre-release
          # 徽章，且 /releases/latest 只认非预发布（正式实例自更新取数端点）
          IS_PRERELEASE=""
          case "$RELREF" in *-*) IS_PRERELEASE="yes";; esac
          {
            if gh release view "$RELREF" > /dev/null 2>&1; then
              echo "==> release exists — refreshing notes and (re)uploading assets"
              gh release edit "$RELREF" --notes-file release-notes.md
              gh release upload "$RELREF" dist/codecombo-* dist/SHA256SUMS.txt --clobber
            else
              gh release create "$RELREF" \
                --title "Codecombo ${RELREF}" \
                --notes-file release-notes.md \
                --generate-notes \
                $([ -n "$IS_PRERELEASE" ] && echo --prerelease) \
                dist/codecombo-* dist/SHA256SUMS.txt
            fi
            # 幂等收口：draft（删 tag 转化等）强制发布态，并按 tag 形态补预发布标记
            gh release edit "$RELREF" --draft=false --latest=false
            if [ -n "$IS_PRERELEASE" ]; then
              gh release edit "$RELREF" --prerelease
            fi
          } 2>&1 | tee gh-release.log

      - name: Push diagnostics
        if: always()
        run: |
          git config user.email "noreply@github.com"
          git config user.name "release-diagnostics"
          git fetch origin ci-diagnostics 2>/dev/null || true
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null || git checkout -B ci-diagnostics
          git add build-diagnostic.log gh-release.log 2>/dev/null || true
          git commit -m "release diagnostics for ${RELREF} (run ${GITHUB_RUN_ID})" || exit 0
          git push origin ci-diagnostics --force || echo "diagnostics push failed (non-fatal)"

  # npm 分发（P-20261102-2）：esbuild/biome 同款 optionalDependencies 免脚本机制
  # ——主包 codecombo（wrapper）+ 六平台包（os/cpu 字段交 npm 择一）。NPM_TOKEN
  # secret 未配置时优雅跳过（tag 重打或重跑 workflow 即补发，不挡 GitHub 通道）。
  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: build
    # id-token: --provenance 构建溯源（OIDC 签名证明「包由本仓库 workflow
    # 构建」，npm 页面展示 verified 标）——同时是对抗新账号 spam 风控的
    # 正路（有真实构建溯源的 PUT 优先级更高）
    permissions:
      contents: write
      id-token: write
    env:
      RELREF: ${{ github.event.inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: npm-binaries
          path: dist

      - name: Check npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret 未配置——跳过 npm 发布（npmjs.com 创建 Access Token → 仓 Settings/Secrets 配 NPM_TOKEN 后重跑本 workflow 即补发）"
          fi

      - name: Stage npm packages
        if: steps.token.outputs.present == 'yes'
        run: node scripts/npm-stage.mjs --version "${RELREF#v}"

      - name: Publish to npm
        if: steps.token.outputs.present == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${RELREF#v}"
          # 预发布版本走 next 通道——rc/beta 不抢占 latest（npm install -g codecombo 只认 latest）
          NPM_TAG=latest
          case "$VERSION" in *-*) NPM_TAG=next;; esac
          set -o pipefail
          {
            npm whoami || true
            # 幂等守卫：已发布的版本跳过（补发场景——部分包已在线时重跑
            # 不再因重复版本 EPUBLISH 中断整轮）
            published() { npm view "$1@$2" version > /dev/null 2>&1; }
            # 单包失败不中断整轮（spam 风控曾确定性拦 win32 包致主包永不到达
            # ——主包最先发，失败收集汇总，末尾有失败才标红）
            failed=''
            if published "codecombo" "$VERSION"; then
              echo "skip codecombo@$VERSION (already published)"
            else
              npm publish npm/dist/codecombo/ --tag "$NPM_TAG" --provenance --access public || failed="$failed codecombo"
            fi
            for d in npm/dist/codecombo-*/; do
              name=$(node -p "require('./' + process.argv[1] + 'package.json').name" "$d")
              if published "$name" "$VERSION"; then
                echo "skip $name@$VERSION (already published)"
                continue
              fi
              npm publish "$d" --tag "$NPM_TAG" --provenance --access public || failed="$failed $name"
            done
            if [ -n "$failed" ]; then
              echo "FAILED PACKAGES:$failed"
              exit 1
            fi
          } 2>&1 | tee npm-publish.log

      # npm 发布失败诊断推回 ci-diagnostics（token 值 npm 自动脱敏，不落日志）
      - name: Push npm diagnostics
        if: failure()
        run: |
          git config user.email "noreply@github.com"
          git config user.name "release-diagnostics"
          git fetch origin ci-diagnostics 2>/dev/null || true
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null || git checkout -B ci-diagnostics
          git add npm-publish.log
          git commit -m "npm publish diagnostics for ${RELREF} (${GITHUB_SHA})" || exit 0
          git push origin ci-diagnostics --force
