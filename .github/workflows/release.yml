name: Release

on:
  push:
    tags:
      # SemVer 全形态：正式 vX.Y.Z 与预发布 vX.Y.Z-*（rc/beta 等预发布通道走
      # 同一构建流程，P-20261101-2）。glob 语义按官方 filter pattern cheat sheet
      # （[0-9]=单字符区间，+=前一字符一个或多个，*=零或多字符）
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh derives the version from the nearest reachable v* tag
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build all platforms
        shell: bash
        run: set -o pipefail; ./build.sh all 2>&1 | tee build-diagnostic.log

      # 失败时把构建日志推回 ci-diagnostics 分支（raw 可匿名直读）——
      # Actions log API 与 artifact 下载都要求登录，这是自服务诊断通道
      - name: Push build diagnostics
        if: failure()
        run: |
          git config user.email "noreply@github.com"
          git config user.name "release-diagnostics"
          git fetch origin ci-diagnostics 2>/dev/null || true
          git checkout -B ci-diagnostics origin/ci-diagnostics 2>/dev/null || git checkout -B ci-diagnostics
          git add build-diagnostic.log
          git commit -m "build diagnostics for ${GITHUB_REF_NAME} (${GITHUB_SHA})" || exit 0
          git push origin ci-diagnostics

      # npm 分发（P-20261102-2）需要裸二进制（release 资产是同名裸文件，但
      # 跨 job 传递走 artifact 最省依赖——不与 release 创建步骤耦合）
      - name: Upload raw binaries for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: npm-binaries
          path: dist/codecombo-*
          if-no-files-found: error
          retention-days: 1

      - name: Generate checksums
        run: |
          cd dist
          sha256sum codecombo-* > SHA256SUMS.txt

      # Release 页简要说明 = CHANGELOG 本版本段（Keep a Changelog 惯例——
      # 版本叙事唯一事实源在 CHANGELOG，发布页只做摘录不做第二份手写）
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "[" v "]") > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/wtr20211202/codecombo/blob/main/CHANGELOG.md) for what is new." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          # 预发布标记：tag 含 '-' 即 SemVer 预发布形态（v0.2.0-rc1/v0.2.0-beta.2）
          # ——GitHub 页面带 Pre-release 徽章，且 /releases/latest 只认非预发布
          # （正式实例自更新 GitHubSource.FetchLatest 的取数端点），rc 不会推进
          # 正式实例的自动更新通道；rc 测试实例显式走具体 tag 的资产下载。
          # 产物与校验链（SHA256SUMS/.sig 签名）与正式版同链——资产名不变是
          # 自更新契约，此处零特例
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/codecombo-*
            dist/SHA256SUMS.txt

  # npm 分发（P-20261102-2）：esbuild/biome 同款 optionalDependencies 免脚本机制
  # ——主包 codecombo（wrapper）+ 六平台包（os/cpu 字段交 npm 择一）。NPM_TOKEN
  # secret 未配置时优雅跳过（tag 重打或重跑 workflow 即补发，不挡 GitHub 通道）。
  npm-publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: npm-binaries
          path: dist

      - name: Check npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret 未配置——跳过 npm 发布（npmjs.com 创建 Access Token → 仓 Settings/Secrets 配 NPM_TOKEN 后重跑本 workflow 即补发）"
          fi

      - name: Stage npm packages
        if: steps.token.outputs.present == 'yes'
        run: node scripts/npm-stage.mjs --version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        if: steps.token.outputs.present == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 预发布版本走 next 通道——rc/beta 不抢占 latest（npm install -g codecombo 只认 latest）
          NPM_TAG=latest
          case "$VERSION" in *-*) NPM_TAG=next;; esac
          for d in npm/dist/codecombo-*/; do
            npm publish "$d" --tag "$NPM_TAG"
          done
          npm publish npm/dist/codecombo/ --tag "$NPM_TAG"
