name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS may be added later; Windows + Linux are the supported dev/target platforms.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (includes vue-tsc type-check)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Frontend unit tests
        working-directory: web
        run: npm run test:unit

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        shell: bash
        run: set -o pipefail; go test ./... -v 2>&1 | tee go-test.log

      # 失败日志留存为 artifact（匿名可下载）——runner 环境差异排查面，
      # 本地全绿/runner 双红的差异诊断一直缺日志（Actions log API 需登录）
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log-${{ matrix.os }}
          path: go-test.log
          retention-days: 7
